<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="glow4" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oilCan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="oilDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#95B9FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <rect width="600" height="400" fill="url(#glow4)"/>

  <!-- Oil can -->
  <g transform="translate(200,120)">
    <path d="M20 40 L140 40 L150 260 Q150 280 130 280 L30 280 Q10 280 10 260 Z" fill="url(#oilCan)" stroke="#0066FF" stroke-width="3"/>
    <rect x="0" y="20" width="160" height="24" rx="8" fill="#0066FF"/>
    <path d="M150 60 L210 30 L215 55 L160 90 Z" fill="#0066FF" stroke="#95B9FF" stroke-width="2"/>
    <rect x="50" y="120" width="60" height="70" rx="6" fill="#05070B" opacity="0.5"/>
    <text x="80" y="163" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#95B9FF" text-anchor="middle">OLI</text>
  </g>

  <!-- Oil drop falling -->
  <path d="M400 100 C400 130 375 145 375 170 a25 25 0 0 0 50 0 C425 145 400 130 400 100 Z" fill="url(#oilDrop)"/>

  <!-- Ripple accents -->
  <circle cx="400" cy="260" r="14" fill="none" stroke="#0066FF" stroke-width="3" opacity="0.7"/>
  <circle cx="400" cy="260" r="28" fill="none" stroke="#0066FF" stroke-width="2" opacity="0.4"/>
  <circle cx="400" cy="260" r="42" fill="none" stroke="#0066FF" stroke-width="1.5" opacity="0.2"/>

  <g transform="translate(40,40)">
    <rect width="150" height="34" rx="17" fill="#0066FF" opacity="0.15" stroke="#0066FF" stroke-width="1.5"/>
    <text x="75" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#95B9FF" text-anchor="middle" letter-spacing="1">HOME SERVICE</text>
  </g>
</svg>
