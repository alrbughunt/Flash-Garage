<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rotor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="70%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  <rect width="600" height="400" fill="url(#glow3)"/>

  <!-- Brake disc -->
  <g transform="translate(300,200)">
    <circle r="120" fill="url(#rotor)" stroke="#0066FF" stroke-width="3"/>
    <circle r="120" fill="none" stroke="#0B1220" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="95" fill="none" stroke="#0B1220" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="45" fill="#111827" stroke="#374151" stroke-width="3"/>
    <circle r="12" fill="#0066FF"/>
    <!-- bolt holes -->
    <g fill="#05070B">
      <circle cx="0" cy="-32" r="7"/>
      <circle cx="28" cy="16" r="7"/>
      <circle cx="-28" cy="16" r="7"/>
      <circle cx="18" cy="-24" r="4"/>
      <circle cx="-18" cy="-24" r="4"/>
    </g>
    <!-- Brake caliper -->
    <g transform="translate(85,-70)">
      <rect x="-25" y="-15" width="70" height="60" rx="10" fill="#0066FF" stroke="#95B9FF" stroke-width="2"/>
      <rect x="-15" y="-5" width="50" height="14" rx="4" fill="#05070B" opacity="0.5"/>
      <rect x="-15" y="20" width="50" height="14" rx="4" fill="#05070B" opacity="0.5"/>
    </g>
  </g>

  <!-- Warning/safety spark accent -->
  <path d="M470 300 L480 300 L473 320 L488 320 L462 355 L470 328 L458 328 Z" fill="#95B9FF"/>

  <g transform="translate(40,40)">
    <rect width="150" height="34" rx="17" fill="#0066FF" opacity="0.15" stroke="#0066FF" stroke-width="1.5"/>
    <text x="75" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#95B9FF" text-anchor="middle" letter-spacing="1">HOME SERVICE</text>
  </g>
</svg>
