<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="glow2" cx="70%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- Diagnostic scanner / laptop connected to engine -->
  <g transform="translate(120,140)">
    <rect x="0" y="40" width="180" height="120" rx="12" fill="#111827" stroke="#0066FF" stroke-width="3"/>
    <circle cx="40" cy="80" r="18" fill="#0066FF" opacity="0.85"/>
    <circle cx="140" cy="80" r="18" fill="#0066FF" opacity="0.85"/>
    <rect x="25" y="120" width="130" height="10" rx="5" fill="#0B1220" stroke="#0066FF" stroke-width="1.5"/>
  </g>

  <!-- Cable to diagnostic device -->
  <path d="M300 200 C340 200 340 260 380 260" stroke="#0066FF" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Laptop / scanner tool -->
  <g transform="translate(370,250)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#1F2937" stroke="url(#metal2)" stroke-width="2"/>
    <rect x="8" y="10" width="94" height="42" rx="3" fill="#05070B"/>
    <path d="M20 45 L35 25 L48 38 L65 15 L88 40" stroke="#0066FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-6" y="70" width="122" height="8" rx="4" fill="url(#metal2)"/>
  </g>

  <!-- Extra spark bursts for "spesial" premium feel -->
  <path d="M480 90 L490 90 L484 108 L498 108 L474 140 L480 112 L468 112 Z" fill="#0066FF"/>
  <path d="M100 60 L106 60 L102 72 L112 72 L96 96 L100 76 L92 76 Z" fill="#95B9FF"/>
  <circle cx="470" cy="150" r="3" fill="#95B9FF"/>
  <circle cx="490" cy="170" r="2" fill="#95B9FF"/>
  <circle cx="450" cy="180" r="2.5" fill="#95B9FF"/>

  <g transform="translate(40,40)">
    <rect width="150" height="34" rx="17" fill="#0066FF" opacity="0.15" stroke="#0066FF" stroke-width="1.5"/>
    <text x="75" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#95B9FF" text-anchor="middle" letter-spacing="1">HOME SERVICE</text>
  </g>
</svg>
